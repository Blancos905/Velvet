# --- Velvet: proxy API Spring (stesso host del sito SPA) ---
# Incollare nel website ISPConfig → tab "Options" / "Nginx Directives"
# (deve finire DENTRO il blocco server { ... } HTTPS del sito, es. velvet.salonivelvet.lan).
#
# Spring in ascolto su 127.0.0.1:8082 (vedi SERVER_PORT / velvet.service).
# Il frontend in prod con VITE_API_BASE_URL vuoto usa path relativi /api/... → questo blocco le inoltra al jar.
#
# Dopo incolla:  sudo nginx -t && sudo systemctl reload nginx

location /api/ {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

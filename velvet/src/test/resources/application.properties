# H2 in-memory (forzato anche con SPRING_DATASOURCE_URL in shell da VelvetTestEnvironmentPostProcessor).
spring.datasource.url=jdbc:h2:mem:velvet-tests;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
velvet.security.refresh-token-store=memory
velvet.registration.email-verification-required=false

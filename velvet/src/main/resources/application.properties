spring.application.name=velvet
spring.profiles.default=local

# Database persistente (MariaDB ISPConfig): default = profilo `local`.
# Override esplicito possibile con SPRING_PROFILES_ACTIVE=prod (o altro profilo dedicato).

server.port=8080

# Vetrina/sito salone salvato lato server: il payload JSON include immagini come data URL base64 (vari MB).
# Alziamo i limiti del body per evitare troncamenti/errori su PUT /api/v1/me/salon/site-content/**.
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

# Dev: log in console ogni richiesta che arriva a Spring (metodo, URI, status, ms, IP client).
# Se il browser mostra 500 ma non compare alcuna riga «HTTP … -> …» qui sotto, la richiesta non sta arrivando a questo processo (es. proxy Vite verso 8080 assente/errato, altra porta, errore generato solo nel browser).
# Probe dev (banner WebView, wait-for-backend.sh): GET /api/v1/public/health
# velvet.dev.http-access-log=true

# JWT accesso /api/v1/me/** (HS256, emesso da POST /api/v1/auth/login). Opzionale: segreto dedicato (default = token-secret).
# velvet.security.auth-jwt-secret=
# Access token breve (minuti) + refresh token con rotazione (giorni) — requisito sicurezza store/production.
velvet.security.auth-access-ttl-minutes=15
velvet.security.refresh-token-ttl-days=30
velvet.security.rate-limit-enabled=true
# Store refresh token: memory (dev/test) | redis (docker/prod)
velvet.security.refresh-token-store=memory
# Evita connessione Redis automatica quando lo store è in-memory.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
spring.data.redis.repositories.enabled=false

# SEO SSR pagine salone (/saloni/{slug}): in Docker montare la build SPA su velvet.seo.web-static-root.
velvet.seo.web-static-root=
velvet.seo.site-base-url=
velvet.security.rate-limit-requests-per-minute=30
# Legacy: se impostato, sovrascrive auth-access-ttl-minutes solo se auth-access-ttl-minutes non è configurato esplicitamente.
velvet.security.auth-jwt-ttl-hours=24

# OpenAPI: http://localhost:8080/v3/api-docs — disabilitare in prod se necessario
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false

# Datasource/JPA definiti nei profili (`application-local.properties`, `application-prod.properties`).

# HikariCP: timeout connessione (ms) — evita thread bloccati a oltranza se PostgreSQL non risponde.
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.validation-timeout=5000

# Token firmati (accesso account + gestione prenotazione/recensioni): in prod usare segreto lungo (VELVET_TOKEN_SECRET).
velvet.security.token-secret=${VELVET_TOKEN_SECRET:}
velvet.security.review-token-ttl-days=30

# Notifiche (conferma immediata + promemoria T-2h). URL base del frontend per link "Gestisci".
# Coda transazionale: inbox in-app + push FCM + email SMTP (opzionale) + log backend.
velvet.notifications.enabled=true
velvet.notifications.frontend-base-url=http://localhost:5173
velvet.notifications.consumer-appointments-path=/account/prenotazioni
# Recupero password: il link generato viene SOLO loggato sul backend (frontend-base-url + password-reset-path ?token=…)
velvet.notifications.password-reset-path=/reimposta-password
velvet.notifications.password-reset-token-ttl-minutes=60
velvet.notifications.email-verification-path=/conferma-email
velvet.notifications.email-verification-token-ttl-minutes=1440
# Conferma email obbligatoria in registrazione cliente/salone (disabilita in test: velvet.registration.email-verification-required=false)
velvet.registration.email-verification-required=true
velvet.notifications.poll-interval-ms=15000
# velvet.notifications.review-path=/recensione
# velvet.notifications.review-invite-offset-hours=2

# Email transazionali (conferma prenotazione, promemoria). In dev: source velvet/spring-dev.local.env
velvet.mail.enabled=${VELVET_MAIL_ENABLED:false}
velvet.mail.from=${VELVET_MAIL_FROM:noreply@saloniluxury.it}
velvet.mail.from-display-name=${VELVET_MAIL_FROM_DISPLAY_NAME:Saloni Luxury}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL:false}
# In dev velvet.mail.enabled=false e SMTP spesso assente: evita MailHealthIndicator DOWN + timeout ~11s su /actuator/health.
management.health.mail.enabled=false

# Push FCM (Firebase Admin SDK). In dev: ./scripts/setup-firebase-credentials.sh <file.json>
# Oppure path assoluto / classpath:firebase-service-account.json / env GOOGLE_APPLICATION_CREDENTIALS.
# velvet.firebase.enabled=true
# velvet.firebase.service-account-resource=firebase-service-account.json
# velvet.firebase.service-account-path=

# CORS (opzionale): solo se il browser chiama l’API da un altro host (in dev il proxy Vite evita il bisogno).
# Pattern Spring (es. https://www.example.com); più origini separate da virgola.
# velvet.cors.allowed-origins=https://www.example.com

# Super admin (/api/v1/admin/**, JWT con ROLE_ADMIN). Dev: default in application-local.properties. Prod: vedi application-prod.properties.
velvet.super-admin.username=${VELVET_SUPER_ADMIN_USERNAME:}
velvet.super-admin.password=${VELVET_SUPER_ADMIN_PASSWORD:}
velvet.super-admin.password-hash=${VELVET_SUPER_ADMIN_PASSWORD_HASH:}
velvet.super-admin.setup-token=${VELVET_SUPER_ADMIN_SETUP_TOKEN:}
# Anagrafica consumer del super admin (assistenza / panoramica): opzionali; se valorizzati vengono riallineati all’avvio.
velvet.super-admin.profile-display-name=${VELVET_SUPER_ADMIN_PROFILE_DISPLAY_NAME:}
velvet.super-admin.profile-phone=${VELVET_SUPER_ADMIN_PROFILE_PHONE:}

# Conservazione log di sicurezza/sessione (informativa privacy; allineare a VITE_LOG_RETENTION_DAYS nel frontend).
velvet.logging.retention-days=${VELVET_LOG_RETENTION_DAYS:180}
velvet.logging.retention-cron=${VELVET_LOG_RETENTION_CRON:0 30 4 * * *}

# Stripe billing (test mode senza P.IVA: velvet.billing.enabled=true + chiavi sk_test_/whsec_/price_).
velvet.billing.enabled=${VELVET_BILLING_ENABLED:false}
velvet.billing.secret-key=${STRIPE_SECRET_KEY:}
velvet.billing.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
velvet.billing.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}
velvet.billing.checkout-success-path=/account/billing/success
velvet.billing.checkout-cancel-path=/piani/premium-prova
velvet.billing.portal-return-path=/account/profilo

# Cliente salone (legame profilo↔sede): job giornaliero che rimuove il legame se nessun appuntamento futuro e ultima fine appuntamento (o creazione anagrafica) oltre N giorni.
velvet.salon-clients.inactivity-expiry-days=${VELVET_SALON_CLIENT_INACTIVITY_DAYS:90}
velvet.salon-clients.inactivity-expiry-cron=${VELVET_SALON_CLIENT_INACTIVITY_CRON:0 15 5 * * *}

# --- Profilo local (default in dev) ---
spring.config.activate.on-profile=local
# CORS: Vite/React dev, WebView mobile, chiamate dirette a :8080 (senza proxy).
velvet.cors.allowed-origins=\
http://localhost:5173,\
http://localhost:3000,\
http://127.0.0.1:5173,\
http://127.0.0.1:3000,\
http://10.0.2.2:5173,\
http://192.168.*.*:5173,\
http://192.168.*.*:3000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

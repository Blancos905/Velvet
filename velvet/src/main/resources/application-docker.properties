# Profilo Docker Compose (PostgreSQL + Redis opzionale)
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator: solo /actuator/health esposto (usato dall'healthcheck del container), senza dettagli.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

velvet.security.token-secret=${VELVET_TOKEN_SECRET}
velvet.security.auth-jwt-secret=${VELVET_AUTH_JWT_SECRET:${VELVET_TOKEN_SECRET}}
velvet.security.auth-access-ttl-minutes=15
velvet.security.refresh-token-ttl-days=30
velvet.security.rate-limit-enabled=true

# Refresh token rotation su Redis (container backplane).
velvet.security.refresh-token-store=redis
velvet.redis.host=${SPRING_DATA_REDIS_HOST:redis}
velvet.redis.port=${SPRING_DATA_REDIS_PORT:6379}
velvet.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

velvet.seo.web-static-root=/app/web
velvet.seo.site-base-url=${VELVET_PUBLIC_FRONTEND_URL}

velvet.notifications.frontend-base-url=${VELVET_PUBLIC_FRONTEND_URL}

velvet.billing.enabled=${VELVET_BILLING_ENABLED:false}
velvet.billing.secret-key=${STRIPE_SECRET_KEY:}
velvet.billing.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
velvet.billing.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}

velvet.mail.enabled=${VELVET_MAIL_ENABLED:false}
velvet.mail.from=${VELVET_MAIL_FROM:noreply@saloniluxury.it}
velvet.mail.from-display-name=${VELVET_MAIL_FROM_DISPLAY_NAME:Saloni Luxury}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL:false}

velvet.super-admin.username=${VELVET_SUPER_ADMIN_USERNAME:}
velvet.super-admin.password-hash=${VELVET_SUPER_ADMIN_PASSWORD_HASH:}

# CORS quando SPA servita da nginx stesso host
velvet.cors.allowed-origins=${VELVET_CORS_ALLOWED_ORIGINS:}

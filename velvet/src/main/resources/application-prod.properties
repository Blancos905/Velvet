# Profilo produzione / VM (MariaDB ISPConfig). Attivare con: SPRING_PROFILES_ACTIVE=prod
# Il pannello ISPConfig usa già la porta 8080 su nginx: l'API Spring usa un'altra porta.

server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/c1velvet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:c1velvet_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate 7: senza metadati JDBC (connessione assente o non ancora disponibile) l'avvio fallisce se il dialect non è esplicito.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# OpenAPI / Swagger UI disattivati in prod. In lab: SPRINGDOC_API_DOCS_ENABLED=true in EnvironmentFile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Risposte errore senza stack trace né dettaglio interno al client
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# OAuth2 / Keycloak: valorizzare in EnvironmentFile sulla VM (issuer pubblico raggiungibile da backend e browser).
# spring.security.oauth2.resourceserver.jwt.issuer-uri=

# Token HMAC (prebooking/recensioni): in prod usare segreto lungo e non predefinito.
velvet.security.token-secret=${VELVET_TOKEN_SECRET}
velvet.security.auth-access-ttl-minutes=${VELVET_AUTH_ACCESS_TTL_MINUTES:15}
velvet.security.refresh-token-ttl-days=${VELVET_REFRESH_TOKEN_TTL_DAYS:30}
velvet.security.rate-limit-enabled=true
velvet.security.rate-limit-requests-per-minute=30

# Notifiche: URL pubblico del sito (link «Gestisci» / «Recensione»). Le notifiche transazionali NON inviano email.
velvet.notifications.frontend-base-url=${VELVET_PUBLIC_FRONTEND_URL:https://localhost}
velvet.notifications.review-invite-offset-hours=${VELVET_REVIEW_INVITE_OFFSET_HOURS:2}

# WhatsApp: il backend invia POST JSON (to, message, appointmentId, notificationType) al webhook configurato.
# In produzione usa il bridge in deploy/whatsapp-bridge oppure un endpoint equivalente (Make, Zapier, ecc.).
velvet.notifications.whatsapp-enabled=${VELVET_NOTIFICATIONS_WHATSAPP_ENABLED:false}
velvet.notifications.whatsapp-webhook-url=${VELVET_NOTIFICATIONS_WHATSAPP_WEBHOOK_URL:}
velvet.notifications.whatsapp-bearer-token=${VELVET_NOTIFICATIONS_WHATSAPP_BEARER_TOKEN:}
velvet.notifications.whatsapp-default-country-calling-code=${VELVET_NOTIFICATIONS_WHATSAPP_DEFAULT_COUNTRY_CALLING_CODE:39}

# Super admin: nessun default in produzione — impostare username + password o password-hash (BCrypt) via env.
# Prima installazione via UI: solo setup-token + DB vuoto + nessuna username/password/hash in env → POST /api/v1/admin/auth/register
velvet.super-admin.username=${VELVET_SUPER_ADMIN_USERNAME:}
velvet.super-admin.password=${VELVET_SUPER_ADMIN_PASSWORD:}
velvet.super-admin.password-hash=${VELVET_SUPER_ADMIN_PASSWORD_HASH:}
velvet.super-admin.setup-token=${VELVET_SUPER_ADMIN_SETUP_TOKEN:}
velvet.super-admin.profile-display-name=${VELVET_SUPER_ADMIN_PROFILE_DISPLAY_NAME:}
velvet.super-admin.profile-phone=${VELVET_SUPER_ADMIN_PROFILE_PHONE:}

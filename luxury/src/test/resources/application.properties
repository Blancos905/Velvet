# H2 in-memory (forzato anche con SPRING_DATASOURCE_URL in shell da LuxuryTestEnvironmentPostProcessor).
spring.datasource.url=jdbc:h2:mem:luxury-tests;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
luxury.security.refresh-token-store=memory
luxury.registration.email-verification-required=false
luxury.billing.enabled=true
luxury.billing.secret-key=sk_test_integration
luxury.billing.premium-price-id=price_test_integration
luxury.billing.webhook-secret=whsec_test_integration

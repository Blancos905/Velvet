# Profilo Docker Compose (PostgreSQL + Redis opzionale)
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator: solo /actuator/health esposto (usato dall'healthcheck del container), senza dettagli.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

luxury.security.token-secret=${LUXURY_TOKEN_SECRET}
luxury.security.auth-jwt-secret=${LUXURY_AUTH_JWT_SECRET:${LUXURY_TOKEN_SECRET}}
luxury.security.auth-access-ttl-minutes=15
luxury.security.refresh-token-ttl-days=30
luxury.security.rate-limit-enabled=true

# Refresh token rotation su Redis (container backplane).
luxury.security.refresh-token-store=redis
luxury.redis.host=${SPRING_DATA_REDIS_HOST:redis}
luxury.redis.port=${SPRING_DATA_REDIS_PORT:6379}
luxury.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

luxury.seo.web-static-root=/app/web
luxury.seo.site-base-url=${LUXURY_PUBLIC_FRONTEND_URL}

luxury.notifications.frontend-base-url=${LUXURY_PUBLIC_FRONTEND_URL}

luxury.billing.enabled=${LUXURY_BILLING_ENABLED:false}
luxury.billing.promotional-trial-days=${LUXURY_BILLING_PROMOTIONAL_TRIAL_DAYS:60}
luxury.billing.secret-key=${STRIPE_SECRET_KEY:}
luxury.billing.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
luxury.billing.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}

luxury.billing.issuer.fatturapa-enabled=${LUXURY_FATTURAPA_ENABLED:true}
luxury.billing.issuer.legal-name=${LUXURY_BILLING_ISSUER_LEGAL_NAME:}
luxury.billing.issuer.vat-number=${LUXURY_BILLING_ISSUER_VAT:}
luxury.billing.issuer.fiscal-code=${LUXURY_BILLING_ISSUER_FISCAL_CODE:}
luxury.billing.issuer.address-line1=${LUXURY_BILLING_ISSUER_ADDRESS:}
luxury.billing.issuer.postal-code=${LUXURY_BILLING_ISSUER_POSTAL_CODE:}
luxury.billing.issuer.city=${LUXURY_BILLING_ISSUER_CITY:}
luxury.billing.issuer.province=${LUXURY_BILLING_ISSUER_PROVINCE:}
luxury.billing.issuer.country=${LUXURY_BILLING_ISSUER_COUNTRY:IT}
luxury.billing.issuer.tax-regime=${LUXURY_BILLING_ISSUER_TAX_REGIME:RF19}
luxury.billing.issuer.vat-nature=${LUXURY_BILLING_ISSUER_VAT_NATURE:N2.2}
luxury.billing.issuer.vat-rate=${LUXURY_BILLING_ISSUER_VAT_RATE:0.00}
luxury.billing.issuer.admin-notification-email=${LUXURY_BILLING_ISSUER_ADMIN_EMAIL:}
luxury.billing.issuer.bollo-threshold-cents=${LUXURY_BILLING_BOLLO_THRESHOLD_CENTS:7747}

luxury.mail.enabled=${LUXURY_MAIL_ENABLED:false}
luxury.mail.from=${LUXURY_MAIL_FROM:noreply@saloniluxury.it}
luxury.mail.from-display-name=${LUXURY_MAIL_FROM_DISPLAY_NAME:Saloni Luxury}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL:false}

luxury.super-admin.username=${LUXURY_SUPER_ADMIN_USERNAME:}
luxury.super-admin.password-hash=${LUXURY_SUPER_ADMIN_PASSWORD_HASH:}

# CORS quando SPA servita da nginx stesso host
luxury.cors.allowed-origins=${LUXURY_CORS_ALLOWED_ORIGINS:}

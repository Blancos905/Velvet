# Profilo produzione / VM (MariaDB ISPConfig). Attivare con: SPRING_PROFILES_ACTIVE=prod
# Il pannello ISPConfig usa già la porta 8080 su nginx: l'API Spring usa un'altra porta.

server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/c1luxury}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:c1luxury_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate 7: senza metadati JDBC (connessione assente o non ancora disponibile) l'avvio fallisce se il dialect non è esplicito.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# OpenAPI / Swagger UI disattivati in prod. In lab: SPRINGDOC_API_DOCS_ENABLED=true in EnvironmentFile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Risposte errore senza stack trace né dettaglio interno al client
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Token HMAC (prebooking/recensioni): in prod usare segreto lungo e non predefinito.
luxury.security.token-secret=${LUXURY_TOKEN_SECRET}
luxury.security.auth-access-ttl-minutes=${LUXURY_AUTH_ACCESS_TTL_MINUTES:15}
luxury.security.refresh-token-ttl-days=${LUXURY_REFRESH_TOKEN_TTL_DAYS:1}
luxury.security.session-max-hours=${LUXURY_SESSION_MAX_HOURS:24}
luxury.security.rate-limit-enabled=true
luxury.security.rate-limit-requests-per-minute=30
# Cookie di refresh visibile anche a salone. e admin. (stessa sessione, tre host).
luxury.security.refresh-cookie-domain=${LUXURY_REFRESH_COOKIE_DOMAIN:saloniluxury.it}

# Notifiche: URL pubblico del sito (link «Gestisci» / «Recensione»).
luxury.notifications.frontend-base-url=${LUXURY_PUBLIC_FRONTEND_URL:https://www.saloniluxury.it}
luxury.notifications.review-invite-offset-hours=${LUXURY_REVIEW_INVITE_OFFSET_HOURS:2}

# Email transazionali (conferma prenotazione, promemoria). Richiede casella noreply@ e SMTP configurato.
luxury.mail.enabled=${LUXURY_MAIL_ENABLED:false}
luxury.mail.from=${LUXURY_MAIL_FROM:noreply@saloniluxury.it}
luxury.mail.from-display-name=${LUXURY_MAIL_FROM_DISPLAY_NAME:Saloni Luxury}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL:false}

# Push FCM: montare il JSON del service account e puntare il path (non committare segreti).
luxury.firebase.service-account-path=${LUXURY_FIREBASE_SERVICE_ACCOUNT:}

# Super admin: nessun default in produzione — impostare username + password o password-hash (BCrypt) via env.
# Prima installazione via UI: solo setup-token + DB vuoto + nessuna username/password/hash in env → POST /api/v1/admin/auth/register
luxury.super-admin.username=${LUXURY_SUPER_ADMIN_USERNAME:}
luxury.super-admin.password=${LUXURY_SUPER_ADMIN_PASSWORD:}
luxury.super-admin.password-hash=${LUXURY_SUPER_ADMIN_PASSWORD_HASH:}
luxury.super-admin.setup-token=${LUXURY_SUPER_ADMIN_SETUP_TOKEN:}
luxury.super-admin.profile-display-name=${LUXURY_SUPER_ADMIN_PROFILE_DISPLAY_NAME:}
luxury.super-admin.profile-phone=${LUXURY_SUPER_ADMIN_PROFILE_PHONE:}

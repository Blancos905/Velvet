spring.application.name=luxury
spring.profiles.default=local

# Database persistente (MariaDB ISPConfig): default = profilo `local`.
# Override esplicito possibile con SPRING_PROFILES_ACTIVE=prod (o altro profilo dedicato).

server.port=8080

# Vetrina/sito salone salvato lato server: il payload JSON include immagini come data URL base64 (vari MB).
# Alziamo i limiti del body per evitare troncamenti/errori su PUT /api/v1/me/salon/site-content/**.
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

# Dev: log in console ogni richiesta che arriva a Spring (metodo, URI, status, ms, IP client).
# Se il browser mostra 500 ma non compare alcuna riga «HTTP … -> …» qui sotto, la richiesta non sta arrivando a questo processo (es. proxy Vite verso 8080 assente/errato, altra porta, errore generato solo nel browser).
# Probe dev (banner WebView, wait-for-backend.sh): GET /api/v1/public/health
# luxury.dev.http-access-log=true

# JWT accesso /api/v1/me/** (HS256, emesso da POST /api/v1/auth/login). Opzionale: segreto dedicato (default = token-secret).
# luxury.security.auth-jwt-secret=
# Access token breve (minuti) + refresh token con rotazione (giorni) — requisito sicurezza store/production.
luxury.security.auth-access-ttl-minutes=15
luxury.security.refresh-token-ttl-days=1
luxury.security.session-max-hours=24
luxury.security.rate-limit-enabled=true
# Store refresh token: memory (dev/test) | redis (docker/prod)
luxury.security.refresh-token-store=memory
# Evita connessione Redis automatica quando lo store è in-memory.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
spring.data.redis.repositories.enabled=false

# SEO SSR pagine salone (/saloni/{slug}): in Docker montare la build SPA su luxury.seo.web-static-root.
luxury.seo.web-static-root=
luxury.seo.site-base-url=
luxury.security.rate-limit-requests-per-minute=30
# Legacy: se impostato, sovrascrive auth-access-ttl-minutes solo se auth-access-ttl-minutes non è configurato esplicitamente.
luxury.security.auth-jwt-ttl-hours=24

# OpenAPI: http://localhost:8080/v3/api-docs — disabilitare in prod se necessario
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false

# Datasource/JPA definiti nei profili (`application-local.properties`, `application-prod.properties`).

# HikariCP: timeout connessione (ms) — evita thread bloccati a oltranza se PostgreSQL non risponde.
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.validation-timeout=5000

# Token firmati (accesso account + gestione prenotazione/recensioni): in prod usare segreto lungo (LUXURY_TOKEN_SECRET).
luxury.security.token-secret=${LUXURY_TOKEN_SECRET:}
luxury.security.review-token-ttl-days=30

# Notifiche (conferma immediata + promemoria T-2h). URL base del frontend per link "Gestisci".
# Coda transazionale: inbox in-app + push FCM + email SMTP (opzionale) + log backend.
luxury.notifications.enabled=true
luxury.notifications.frontend-base-url=${LUXURY_NOTIFICATIONS_FRONTEND_BASE_URL:http://localhost:5173}
luxury.notifications.consumer-appointments-path=/account/prenotazioni
# Recupero password: email transazionale se luxury.mail.enabled=true; link anche nel log backend
luxury.notifications.password-reset-path=/reimposta-password
luxury.notifications.password-reset-token-ttl-minutes=60
luxury.notifications.email-verification-path=/conferma-email
luxury.notifications.email-verification-token-ttl-minutes=10080
# Conferma email obbligatoria in registrazione cliente/salone (disabilita in test: luxury.registration.email-verification-required=false)
luxury.registration.email-verification-required=true
luxury.notifications.poll-interval-ms=15000
# luxury.notifications.review-path=/recensione
# luxury.notifications.review-invite-offset-hours=2

# Email transazionali (conferma prenotazione, promemoria). In dev: source luxury/spring-dev.local.env
luxury.mail.enabled=${LUXURY_MAIL_ENABLED:false}
luxury.mail.from=${LUXURY_MAIL_FROM:noreply@saloniluxury.it}
luxury.mail.from-display-name=${LUXURY_MAIL_FROM_DISPLAY_NAME:Saloni Luxury}
luxury.mail.support-notification-to=${LUXURY_MAIL_SUPPORT_TO:assistenza@saloniluxury.it}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:15000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:20000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:20000}
# In dev luxury.mail.enabled=false e SMTP spesso assente: evita MailHealthIndicator DOWN + timeout ~11s su /actuator/health.
management.health.mail.enabled=false
# Solo health: env, heapdump e info (versione Java) non sono esposti.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.env.enabled=false
management.endpoint.heapdump.enabled=false
management.info.java.enabled=false

# Push FCM (Firebase Admin SDK). In dev: ./scripts/setup-firebase-credentials.sh <file.json>
# Oppure path assoluto / classpath:firebase-service-account.json / env GOOGLE_APPLICATION_CREDENTIALS.
# luxury.firebase.enabled=true
# luxury.firebase.service-account-resource=firebase-service-account.json
# luxury.firebase.service-account-path=

# CORS (opzionale): solo se il browser chiama l’API da un altro host (in dev il proxy Vite evita il bisogno).
# Pattern Spring (es. https://www.example.com); più origini separate da virgola.
# luxury.cors.allowed-origins=https://www.example.com

# Super admin (/api/v1/admin/**, JWT con ROLE_ADMIN). Dev: default in application-local.properties. Prod: vedi application-prod.properties.
luxury.super-admin.username=${LUXURY_SUPER_ADMIN_USERNAME:}
luxury.super-admin.password=${LUXURY_SUPER_ADMIN_PASSWORD:}
luxury.super-admin.password-hash=${LUXURY_SUPER_ADMIN_PASSWORD_HASH:}
luxury.super-admin.setup-token=${LUXURY_SUPER_ADMIN_SETUP_TOKEN:}
# Anagrafica consumer del super admin (assistenza / panoramica): opzionali; se valorizzati vengono riallineati all’avvio.
luxury.super-admin.profile-display-name=${LUXURY_SUPER_ADMIN_PROFILE_DISPLAY_NAME:}
luxury.super-admin.profile-phone=${LUXURY_SUPER_ADMIN_PROFILE_PHONE:}

# Conservazione log di sicurezza/sessione (informativa privacy; allineare a VITE_LOG_RETENTION_DAYS nel frontend).
luxury.logging.retention-days=${LUXURY_LOG_RETENTION_DAYS:180}
luxury.logging.retention-cron=${LUXURY_LOG_RETENTION_CRON:0 30 4 * * *}

# Stripe billing (test mode senza P.IVA: luxury.billing.enabled=true + chiavi sk_test_/whsec_/price_).
luxury.billing.enabled=${LUXURY_BILLING_ENABLED:false}
luxury.billing.secret-key=${STRIPE_SECRET_KEY:}
luxury.billing.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
luxury.billing.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}
luxury.billing.checkout-success-path=/account/billing/success
luxury.billing.checkout-cancel-path=/account/billing/checkout
luxury.billing.portal-return-path=/account/profilo
# Branding Stripe Checkout (dark + arancio Saloni Luxury; logo da frontend se URL pubblico)
luxury.billing.checkout.display-name=Saloni Luxury
luxury.billing.checkout.background-color=\#0a0a0a
luxury.billing.checkout.button-color=\#f97316
luxury.billing.checkout.logo-path=/logo-saloni-luxury.png
# luxury.billing.checkout.logo-url=https://www.saloniluxury.it/logo-saloni-luxury.png
luxury.billing.checkout.font-family=inter
# Giorni dopo la scadenza abbonamento disdetto prima della cancellazione automatica profilo salone.
luxury.billing.cancelled-subscription-deletion-days=30
luxury.billing.promotional-trial-days=30
luxury.billing.cancelled-subscription-expiry-cron=0 20 5 * * *
# Email lifecycle billing: rinnovo imminente e avviso pre-cancellazione salone.
luxury.billing.renewal-reminder-days-before=5
luxury.billing.salon-deletion-warning-days-before=7
luxury.billing.lifecycle-email-cron=0 40 5 * * *

# Emittente fattura elettronica (FatturaPA → caricamento gratuito portale AdE).
luxury.billing.issuer.fatturapa-enabled=${LUXURY_FATTURAPA_ENABLED:true}
luxury.billing.issuer.legal-name=${LUXURY_BILLING_ISSUER_LEGAL_NAME:}
luxury.billing.issuer.vat-number=${LUXURY_BILLING_ISSUER_VAT:}
luxury.billing.issuer.fiscal-code=${LUXURY_BILLING_ISSUER_FISCAL_CODE:}
luxury.billing.issuer.address-line1=${LUXURY_BILLING_ISSUER_ADDRESS:}
luxury.billing.issuer.postal-code=${LUXURY_BILLING_ISSUER_POSTAL_CODE:}
luxury.billing.issuer.city=${LUXURY_BILLING_ISSUER_CITY:}
luxury.billing.issuer.province=${LUXURY_BILLING_ISSUER_PROVINCE:}
luxury.billing.issuer.country=${LUXURY_BILLING_ISSUER_COUNTRY:IT}
luxury.billing.issuer.tax-regime=${LUXURY_BILLING_ISSUER_TAX_REGIME:RF19}
luxury.billing.issuer.vat-nature=${LUXURY_BILLING_ISSUER_VAT_NATURE:N2.2}
luxury.billing.issuer.vat-rate=${LUXURY_BILLING_ISSUER_VAT_RATE:0.00}
luxury.billing.issuer.admin-notification-email=${LUXURY_BILLING_ISSUER_ADMIN_EMAIL:}
luxury.billing.issuer.bollo-threshold-cents=${LUXURY_BILLING_BOLLO_THRESHOLD_CENTS:7747}

# Cliente salone (legame profilo↔sede): job giornaliero che rimuove il legame se nessun appuntamento futuro e ultima fine appuntamento (o creazione anagrafica) oltre N giorni.
luxury.salon-clients.inactivity-expiry-days=${LUXURY_SALON_CLIENT_INACTIVITY_DAYS:60}
luxury.salon-clients.inactivity-expiry-cron=${LUXURY_SALON_CLIENT_INACTIVITY_CRON:0 15 5 * * *}

# --- Profilo local (default in dev) ---
spring.config.activate.on-profile=local
# CORS: Vite/React dev, WebView mobile, chiamate dirette a :8080 (senza proxy).
luxury.cors.allowed-origins=\
http://localhost:5173,\
http://localhost:3000,\
http://127.0.0.1:5173,\
http://127.0.0.1:3000,\
http://10.0.2.2:5173,\
http://192.168.*.*:5173,\
http://192.168.*.*:3000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

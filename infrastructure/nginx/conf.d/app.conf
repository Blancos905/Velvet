# =============================================================================
# Nginx — Reverse proxy indurito per Salon Platform
#
#  1) Forza HTTPS (redirect 80 -> 443) e usa TLS 1.3 (con fallback TLS 1.2).
#  2) Header di sicurezza OWASP: HSTS, X-Frame-Options DENY, X-Content-Type-Options nosniff,
#     Referrer-Policy, Permissions-Policy.
#  3) Content Security Policy (CSP) calibrata per la SPA React.
#  4) Serve la SPA statica e fa da proxy verso l'API Spring Boot.
# =============================================================================

# --- Rate limiting di base (anti brute-force su /auth) ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# --- Upstream verso l'API (nome del service Docker) ---
upstream salon_api {
    server api:8080;
    keepalive 32;
}

# --- HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name salonivelvet.it www.salonivelvet.it;

    # Validazione ACME (Let's Encrypt) prima del redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Server HTTPS principale ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name salonivelvet.it www.salonivelvet.it;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.3 preferito, 1.2 come fallback compatibile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Security headers (OWASP) ----
    # HSTS: forza HTTPS per 2 anni, sottodomini inclusi, candidabile alla preload list.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Blocca l'embedding in iframe (anti-clickjacking).
    add_header X-Frame-Options "DENY" always;
    # Impedisce il MIME-sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Limita le info di referrer trasmesse.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Disabilita API del browser non necessarie.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # Cross-origin isolation di base.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- Content Security Policy per la SPA React ----
    # 'self' per script/stili dell'app; consente JSON-LD inline e Google Maps (Local SEO);
    # connect-src verso l'API; nega plugin e framing di terzi (frame-ancestors none).
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' https://www.googletagmanager.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data: https: https://maps.gstatic.com https://*.googleapis.com; \
connect-src 'self' https://api.salonivelvet.it; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self'; \
object-src 'none'; \
upgrade-insecure-requests" always;

    # Nasconde la versione di Nginx.
    server_tokens off;

    # Limite dimensione body (upload immagini vetrina ecc.).
    client_max_body_size 12m;

    # Compressione
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Proxy verso l'API ----
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://salon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # Rate limit più stretto sugli endpoint di autenticazione.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://salon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- Pagine salone: SERVER-SIDE RENDERING dell'head (meta + JSON-LD) ----
    # Instradate al backend così i crawler ricevono i dati strutturati senza JS.
    location /saloni/ {
        proxy_pass http://salon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- Landing categoria+città server-rendered (es. /estetista/milano) ----
    location ~ ^/(parrucchiere|estetista|massaggiatore)/ {
        proxy_pass http://salon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # sitemap/robots generati dinamicamente dal backend (elenco saloni aggiornato).
    location = /robots.txt  { proxy_pass http://salon_api; proxy_set_header Host $host; access_log off; }
    location = /sitemap.xml { proxy_pass http://salon_api; proxy_set_header Host $host; }

    # Asset con cache lunga e hash nel nome (Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: ogni route lato client torna su index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: luxury_app
description: Shell mobile SaloniLuxury — carica luxury-frontend in WebView senza logica duplicata.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.4.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app-icon.png
  remove_alpha_ios: true
  background_color_ios: "#141414"
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: assets/app-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/luxury_subscription_guards.json
    - assets/app-icon.png
